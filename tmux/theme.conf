# theme.conf — visual appearance and status bar styling.

# Reset path display mode to default on reload
set -gu @path_mode

# --- Status Bar General ---
set -g status-position bottom
set -g status-justify centre
set -g status-style "bg=default"
set -g status-interval 15
set -g status-left-length 50
set -g status-right-length 150

# --- Window Status Style & Format ---
set -g window-status-current-style "fg=colour255,bg=default,bold"
set -g window-status-separator ""

set -g window-status-format "#[fg=colour240]#[default] #I:#W#{?window_last_flag,-,} #[fg=colour240]#[default]"
set -g window-status-current-format "#[fg=colour252]#[default] #I:#W* #[fg=colour252]#[default]"

# --- Left / Right Widgets ---
set -g status-left "#S"

# Status-right shows [Z] if zoomed, followed by a conditional | (only if zoomed & path visible), then the path
set -g status-right '#{?window_zoomed_flag,#[default]#[bold][Z],}#{?window_zoomed_flag,#{?#{==:#{@path_mode},none},,#[fg=#{?client_prefix,colour252,colour240}] | },}#[default]#[bold]#(p="#{pane_current_path}"; m="#{@path_mode}"; case "$m" in (home) echo "$p" | sed "s|^$HOME|~|";; (none) echo "";; (*) if [ "$p" = "$HOME" ]; then echo "~"; else r=$(git -C "$p" rev-parse --show-toplevel 2>/dev/null); if [ -n "$r" ]; then echo "$(basename "$r")${p#$r}"; else basename "$p"; fi; fi;; esac)'

# --- Pane Borders ---
set -g pane-border-lines heavy
set -g pane-border-style "fg=colour240"
set -g pane-active-border-style "fg=colour252"

# --- Rule Line & Two-Line Status Layout ---
# The divider rule line glows in colour252 when prefix is held, colour240 otherwise
set -g @dtfs_rule "#[align=left]#[fg=#{?client_prefix,colour252,colour240}]────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────"
set -g @dtfs_bar "#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{E:window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{E:window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"

# Default state: rule ON (Rule is on Row 0, text is on Row 1 so the separator line sits above the text at bottom position)
set -g status 2
set -gF status-format[0] "#{@dtfs_rule}"
set -gF status-format[1] "#{@dtfs_bar}"
