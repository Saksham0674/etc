# tmux.conf — entry point.

# --- Core General Settings ---
set -a terminal-features "tmux-256color:RGB"
set -g extended-keys on
set -g prefix C-SPACE
unbind C-b
bind C-SPACE send-prefix

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on   
set -g mode-keys vi
set -sg escape-time 0

# General Responsiveness & Mouse Defaults
set -g mouse on
set -g focus-events on
set -g set-clipboard on
set -g history-limit 1000000
set -g allow-passthrough on

# --- Tooling Prefix ---
# Pickers live in ~/repos/utils/bin and are invoked as #{@utils}/bin/<name>.
# run-shell inherits the *server's* environment, not the shell's, so a PATH
# entry would go stale until the server restarts. This never does.
set -g @utils '$HOME/repos/utils'

# --- Window Titles ---
# Lets the WM see tmux session names; aerospace-window-picker depends on it
set -g set-titles on
set -g set-titles-string "#S · #W"

# --- Load Config Modules ---
source-file ~/.config/tmux/keymaps.conf
source-file ~/.config/tmux/theme.conf
