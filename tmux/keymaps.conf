# keymaps.conf — keybindings and navigation.

# --- Status Bar Rule Line Toggle ---
bind B if -F '#{==:#{status},2}' {
  set -g status on
  set -gF status-format[0] '#{@dtfs_bar}'
} {
  set -g status 2
  if -F '#{==:#{status-position},top}' {
    set -gF status-format[0] '#{@dtfs_bar}'
    set -gF status-format[1] '#{@dtfs_rule}'
  } {
    set -gF status-format[0] '#{@dtfs_rule}'
    set -gF status-format[1] '#{@dtfs_bar}'
  }
}

# --- Status Bar Position Toggle ---
# prefix b: toggles status bar between top and bottom, adjusting rule line layout
bind b if -F '#{==:#{status-position},top}' {
  set -g status-position bottom
  if -F '#{==:#{status},2}' {
    set -gF status-format[0] '#{@dtfs_rule}'
    set -gF status-format[1] '#{@dtfs_bar}'
  }
} {
  set -g status-position top
  if -F '#{==:#{status},2}' {
    set -gF status-format[0] '#{@dtfs_bar}'
    set -gF status-format[1] '#{@dtfs_rule}'
  }
}

# --- Window Navigation (Prefix-less Alt Binds) ---
bind -n M-h previous-window
bind -n M-l next-window


# --- Windows & Splits ---
# Remove standard Prefix+c
unbind c

# Prefix+n to create window next to current, Prefix+N to create at the end
bind n new-window -a -c "#{pane_current_path}"
bind N new-window -c "#{pane_current_path}"

# Prefix+m to create window next to current prompting for name, Prefix+M to create at the end
bind m command-prompt -p "Window name:" { new-window -a -c "#{pane_current_path}" -n "%%" }
bind M command-prompt -p "Window name:" { new-window -c "#{pane_current_path}" -n "%%" }

# Prefix+x to kill window directly (from ref1)
bind x kill-window

# --- Directional Splits (Prefix + Ctrl + hjkl) ---
# Creates splits in current path
bind C-h split-window -hb -c "#{pane_current_path}"   # Split Left
bind C-j split-window -v  -c "#{pane_current_path}"   # Split Down
bind C-k split-window -vb -c "#{pane_current_path}"   # Split Up
bind C-l split-window -h  -c "#{pane_current_path}"   # Split Right

# --- Pane Resize (Prefix + HJKL) ---
bind -r H resize-pane -L 1
bind -r J resize-pane -D 1
bind -r K resize-pane -U 1
bind -r L resize-pane -R 1

# --- Seamless Neovim-Tmux Split Navigation with Window Spilling ---
# Detects view, vim, nvim, fzf, etc.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

bind-key -n C-h if-shell "$is_vim" "send-keys C-h" "if -F '#{pane_at_left}'   'select-window -t -1' 'select-pane -L'"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j" "if -F '#{pane_at_bottom}' 'select-window -t +1' 'select-pane -D'"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k" "if -F '#{pane_at_top}'    'select-window -t -1' 'select-pane -U'"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l" "if -F '#{pane_at_right}'  'select-window -t +1' 'select-pane -R'"

# Symmetrical navigation inside copy mode
bind -T copy-mode-vi C-h if -F '#{pane_at_left}'   'select-window -t -1' 'select-pane -L'
bind -T copy-mode-vi C-j if -F '#{pane_at_bottom}' 'select-window -t +1' 'select-pane -D'
bind -T copy-mode-vi C-k if -F '#{pane_at_top}'    'select-window -t -1' 'select-pane -U'
bind -T copy-mode-vi C-l if -F '#{pane_at_right}'  'select-window -t +1' 'select-pane -R'

# --- Accidental Exit Guard (C-d Guard) ---
# Intercepts Ctrl-d when zsh is the foreground process, requiring double-tap
is_zsh="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^ ]*\\+[^ ]* +(\\S+\\/)?-?zsh$'"
bind -n C-d if-shell "$is_zsh" {
  run-shell 'last=$(tmux show-option -gqv @cd_armed_at); now=$(date +%s); if [ -n "$last" ] && [ $((now - last)) -le 1 ]; then tmux set-option -gu @cd_armed_at; tmux send-keys C-d; else tmux set-option -g @cd_armed_at "$now"; tmux display-message "C-d again within 1s to exit"; fi'
} {
  send-keys C-d
}

# --- Pickers ---
# Each opens a throwaway window that closes when the picker exits
bind s run "tmux neww -n sessions \"#{@utils}/bin/tmux-session-picker\""
bind f run "tmux neww -n windows \"#{@utils}/bin/aerospace-window-picker\""
bind g run "tmux neww -c '#{pane_current_path}' -n git-open \"#{@utils}/bin/git-open\""
bind o run "tmux neww -n links \"#{@utils}/bin/links-picker\""
bind e run "tmux neww -c '#{pane_current_path}' -n scripts \"#{@utils}/bin/script-runner\""
bind k run "tmux neww -c '#{pane_current_path}' -n typst \"#{@utils}/bin/typst-picker\""
bind p run "tmux neww -n pdf \"#{@utils}/bin/pdf-picker\""
bind t run "tmux neww -n timew \"#{@utils}/bin/timew-picker\""
bind r run "tmux neww -n report \"#{@utils}/bin/timew-report-picker\""
bind R run "tmux neww -n prune \"#{@utils}/bin/timew-prune\""
bind d run "tmux neww -n daily \"#{@utils}/bin/daily\""

# prefix T stops the running timew interval
bind T run-shell 'timew stop >/dev/null 2>&1; tmux display-message "timew stopped"; tmux refresh-client -S'

# Server's global env — use it to check for a stale PATH after editing .zshenv
bind E show-environment -g

# --- Session Switcher (Choose Tree) ---
bind C-s choose-tree -sZ

# --- Copy Mode ---
bind Space copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# Smooth vertical scrolling (1 line at a time instead of 5)
bind -T copy-mode-vi WheelUpPane select-pane \; send-keys -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 1 scroll-down
